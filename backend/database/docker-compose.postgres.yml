services:
  postgres:
    image: postgres:16-alpine
    container_name: ser_inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ser_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-ser_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ser_admin} -d ${POSTGRES_DB:-ser_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5

